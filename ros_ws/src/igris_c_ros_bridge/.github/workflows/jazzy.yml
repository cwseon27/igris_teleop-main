name: Build and Test - Jazzy

on:
  pull_request:
    branches: [ main, cicd ]
  push:
    branches: [ main, cicd ]

jobs:
  build:
    name: Build and Test on ROS2 Jazzy
    runs-on: ubuntu-latest
    steps:
      - name: Checking out
        uses: actions/checkout@v2.3.4

      - name: Building and testing on ROS2 Jazzy
        uses: ichiro-its/ros2-ci@v1.0.0
        with:
          pre-build: git submodule update --init --recursive
          apt-packages: libssl-dev clang-format
          ros2-distro: jazzy
